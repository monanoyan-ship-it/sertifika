<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifika Yonetim Sistemi</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login -->
        <div id="login-page" class="page">
            <div class="login-container">
                <h1>Sertifika Yonetim Sistemi</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Sifre</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Giris Yap</button>
                    <div id="login-error" class="error-msg" style="display:none;"></div>
                </form>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="page" style="display:none;">
            <nav class="navbar">
                <div class="nav-brand">Sertifika Sistemi</div>
                <div class="nav-links">
                    <a href="#" data-page="dashboard" class="nav-link active">Dashboard</a>
                    <a href="#" data-page="templates" class="nav-link">Sablonlar</a>
                    <a href="#" data-page="signatures" class="nav-link">Imzalar</a>
                    <a href="#" data-page="trainings" class="nav-link">Egitimler</a>
                    <a href="#" data-page="companies" class="nav-link">Firmalar</a>
                </div>
                <div class="nav-user">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn btn-sm">Cikis</button>
                </div>
            </nav>

            <div class="container">
                <!-- Dashboard -->
                <div id="page-dashboard" class="content-page">
                    <h2>Dashboard</h2>
                    <div class="stats-grid" id="stats-grid"></div>
                </div>

                <!-- Templates -->
                <div id="page-templates" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2>Sablon Yonetimi</h2>
                        <button class="btn btn-primary" onclick="showTemplateForm()">Yeni Sablon</button>
                    </div>
                    <div id="templates-list" class="card-grid"></div>
                </div>

                <!-- Template Editor -->
                <div id="page-template-editor" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2 id="editor-title">Sablon Editoru</h2>
                        <div>
                            <button class="btn btn-sm" onclick="addFieldToEditor('static')">Metin Ekle</button>
                            <button class="btn btn-sm" onclick="addFieldToEditor('dynamic')">Dinamik Alan</button>
                            <button class="btn btn-sm" onclick="addFieldToEditor('qrcode')">QR Kod</button>
                            <button class="btn btn-primary" onclick="saveTemplate()">Kaydet</button>
                            <button class="btn" onclick="navigateTo('templates')">Geri</button>
                        </div>
                    </div>
                    <div class="editor-container">
                        <div class="editor-canvas-wrapper">
                            <div id="editor-canvas" class="editor-canvas landscape">
                                <img id="editor-bg" class="editor-bg" style="display:none;">
                            </div>
                        </div>
                        <div class="editor-sidebar">
                            <h3>Sablon Ayarlari</h3>
                            <div class="form-group">
                                <label>Sablon Adi</label>
                                <input type="text" id="tpl-name">
                            </div>
                            <div class="form-group">
                                <label>Aciklama</label>
                                <input type="text" id="tpl-desc">
                            </div>
                            <div class="form-group">
                                <label>Yonelim</label>
                                <select id="tpl-orientation" onchange="updateCanvasOrientation()">
                                    <option value="0">Yatay (Landscape)</option>
                                    <option value="1">Dikey (Portrait)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Arka Plan</label>
                                <input type="file" id="tpl-bg-file" accept="image/*">
                            </div>
                            <hr>
                            <h3>Secili Alan</h3>
                            <div id="field-props" style="display:none;">
                                <div class="form-group">
                                    <label>Tip</label>
                                    <span id="field-type-display"></span>
                                </div>
                                <div id="field-static-props">
                                    <div class="form-group">
                                        <label>Metin</label>
                                        <input type="text" id="field-text" oninput="updateSelectedField()">
                                    </div>
                                </div>
                                <div id="field-dynamic-props" style="display:none;">
                                    <div class="form-group">
                                        <label>Dinamik Alan</label>
                                        <select id="field-key" onchange="updateSelectedField()">
                                            <option value="HolderName">Katilimci Ad Soyad</option>
                                            <option value="TrainingName">Egitim Adi</option>
                                            <option value="TrainingDate">Egitim Tarihi</option>
                                            <option value="CompanyName">Firma Adi</option>
                                            <option value="CertificateNo">Sertifika No</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Font</label>
                                    <select id="field-font" onchange="updateSelectedField()">
                                        <option value="Arial">Arial</option>
                                        <option value="Times">Times</option>
                                        <option value="Courier">Courier</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Boyut</label>
                                    <input type="number" id="field-size" value="14" min="8" max="72" onchange="updateSelectedField()">
                                </div>
                                <div class="form-group">
                                    <label>Renk</label>
                                    <input type="color" id="field-color" value="#000000" onchange="updateSelectedField()">
                                </div>
                                <div class="form-group">
                                    <label>Hizalama</label>
                                    <select id="field-align" onchange="updateSelectedField()">
                                        <option value="left">Sol</option>
                                        <option value="center">Orta</option>
                                        <option value="right">Sag</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label><input type="checkbox" id="field-bold" onchange="updateSelectedField()"> Kalin</label>
                                    <label><input type="checkbox" id="field-italic" onchange="updateSelectedField()"> Italik</label>
                                </div>
                                <button class="btn btn-danger btn-sm" onclick="deleteSelectedField()">Alani Sil</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Signatures -->
                <div id="page-signatures" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2>Imza Kutuphanesi</h2>
                        <button class="btn btn-primary" onclick="showSignatureForm()">Yeni Imza</button>
                    </div>
                    <div id="signatures-list" class="card-grid"></div>
                </div>

                <!-- Trainings -->
                <div id="page-trainings" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2>Egitim Yonetimi</h2>
                        <button class="btn btn-primary" onclick="showTrainingForm()">Yeni Egitim</button>
                    </div>
                    <div id="trainings-list"></div>
                </div>

                <!-- Training Detail -->
                <div id="page-training-detail" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2 id="training-detail-title"></h2>
                        <div>
                            <button class="btn btn-sm" onclick="previewCertificate()">Onizleme</button>
                            <button class="btn btn-primary btn-sm" onclick="generateCertificates()">Sertifika Uret</button>
                            <button class="btn btn-sm" onclick="downloadZip()">ZIP Indir</button>
                            <button class="btn btn-sm" onclick="sendCertificates()">E-posta Gonder</button>
                            <button class="btn" onclick="navigateTo('trainings')">Geri</button>
                        </div>
                    </div>
                    <div id="training-detail-info"></div>
                    <div class="page-header" style="margin-top:20px;">
                        <h3>Katilimcilar</h3>
                        <div>
                            <button class="btn btn-sm" onclick="showParticipantForm()">Katilimci Ekle</button>
                            <button class="btn btn-sm" onclick="showExcelUpload()">Excel Yukle</button>
                        </div>
                    </div>
                    <table id="participants-table" class="data-table">
                        <thead>
                            <tr><th>Ad</th><th>Soyad</th><th>E-posta</th><th>Firma</th><th>Sertifika No</th><th>Islem</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- Companies -->
                <div id="page-companies" class="content-page" style="display:none;">
                    <div class="page-header">
                        <h2>Firma Yonetimi</h2>
                        <button class="btn btn-primary" onclick="showCompanyForm()">Yeni Firma</button>
                    </div>
                    <div id="companies-list" class="card-grid"></div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal()">
            <div class="modal" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h3 id="modal-title"></h3>
                    <button class="btn-close" onclick="closeModal()">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/editor.js"></script>
</body>
</html>
