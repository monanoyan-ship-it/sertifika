<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifika Dogrulama</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="verify-container">
        <h1 class="verify-title">Sertifika Dogrulama</h1>
        <form id="verify-form" class="verify-form">
            <div class="form-group">
                <label>Sertifika Numarasi</label>
                <input type="text" id="cert-number" placeholder="CERT-XXXXXXXX-XXXX-XXXX" required>
            </div>
            <button type="submit" class="btn btn-primary">Dogrula</button>
        </form>
        <div id="verify-result"></div>
    </div>

    <script src="/js/verify.js"></script>
</body>
</html>
